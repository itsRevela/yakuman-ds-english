# Automated releases. On every push to master:
#   1. run the tests and check that the committed patch (patch/) matches the sources;
#   2. pick the next version from the Conventional Commit messages since the last tag
#      (feat -> minor, fix/perf -> patch, breaking -> major; see tools/release.py);
#   3. move CHANGELOG.md's [Unreleased] notes under that version, then commit and tag the release,
#      both signed with the maintainer's GPG key (secrets GPG_PRIVATE_KEY and GPG_PASSPHRASE);
#   4. publish a GitHub release with those notes and the .bps patch.
# The patch is built locally because it needs the original ROM, which never goes to GitHub:
#   python tools/build.py && python tools/make_patch.py --publish   (then commit patch/)
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SIGNING_KEY: DC969E4797BBDBD4
  GIT_NAME: itsRevela
  GIT_EMAIL: rexmarek@gmail.com
  PATCH_FILE: patch/Yakuman DS (English).bps

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q

      - name: Check the committed patch matches the sources
        run: python tools/patch_manifest.py check

      - name: Plan the version
        id: plan
        run: |
          version="$(python tools/release.py plan)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing v$version"
          else
            echo "No feat/fix commits since the last release; nothing to release."
          fi

      - name: Import the signing key
        if: steps.plan.outputs.version != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "::error::The GPG_PRIVATE_KEY and GPG_PASSPHRASE repository secrets must be set"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --list-secret-keys "$SIGNING_KEY" > /dev/null
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          printf '#!/bin/sh\nexec gpg --batch --pinentry-mode loopback --passphrase-file "%s" "$@"\n' \
            "$RUNNER_TEMP/gpg-passphrase" > "$RUNNER_TEMP/gpg-sign"
          chmod 700 "$RUNNER_TEMP/gpg-sign"
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git config user.signingkey "$SIGNING_KEY"
          git config gpg.program "$RUNNER_TEMP/gpg-sign"
          git config commit.gpgsign true
          git config tag.gpgSign true

      - name: Commit, tag and push the release
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python tools/release.py changelog "$VERSION" --notes "$RUNNER_TEMP/notes.md"
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "Yakuman DS English Translation v$VERSION"
          git verify-commit HEAD
          git verify-tag "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"

      - name: Publish the GitHub release
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ## How to apply

          Apply `Yakuman DS (English).bps` to an unmodified **Yakuman DS (Japan)** ROM
          (CRC32 `925E2F90`, SHA-1 `19fa78ba37a623e028dd36dabf28b9c2e258e099`) with a BPS patcher
          such as [Rom Patcher JS](https://www.marcrobledo.com/RomPatcher.js/) or Floating IPS.
          The patch checks the ROM's checksum and refuses any other dump.
          EOF
          gh release create "v$VERSION" "$PATCH_FILE" --verify-tag \
            --title "Yakuman DS English Translation v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gpg-passphrase" "$RUNNER_TEMP/gpg-sign"
          gpgconf --kill gpg-agent || true
